<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Radar arquitectónico interactivo: explora y registra obras de arquitectura sobre un mapa en vivo.">
<meta name="color-scheme" content="dark">
<title>NOLLI // RADAR ARQUITECTÓNICO</title>

<!-- Tailwind (CDN, utilidades de layout puntuales) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Mapbox GL JS -->
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<!-- Tipografías: mono para datos, sans geométrica gruesa para títulos -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

<!-- Estilos propios (orden: variables/base → layout → paneles → componentes) -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/map-hud.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/components.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
</head>
<body>

<main>
  <div id="map" role="application" aria-label="Mapa interactivo de obras arquitectónicas"></div>

  <!-- Marco HUD decorativo -->
  <div class="hud-frame" aria-hidden="true">
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>
  </div>
  <div class="hud-crosshair" aria-hidden="true"></div>

  <!-- Barra superior -->
  <header class="topbar">
    <div class="topbar-inner">
      <div style="flex: 1;">
        <h1 class="font-display text-2xl leading-none tracking-tight" style="color:var(--fg); margin:0;">NOLLI<span style="color:var(--accent)">.</span></h1>
        <p class="text-[10px] tracking-widest mt-1" style="color:var(--fg-dim); margin:0;">RADAR ARQUITECTÓNICO — V0.5 ADMIN</p>
        <button id="btn-login-trigger" type="button" class="mt-2 text-[10px] font-bold px-2 py-1 cursor-pointer transition-colors" style="border: 1px solid var(--accent); color: var(--accent); background: rgba(255, 69, 0, 0.1);">[ INICIAR SESIÓN ]</button>
        <button id="btn-admin-panel" type="button" class="btn btn-admin hidden mt-2">PANEL ADMIN</button>
      </div>
      <div class="hud-readout" aria-live="polite">
        <div>LNG <span class="val" id="hud-lng">--.-----</span></div>
        <div>LAT <span class="val" id="hud-lat">--.-----</span></div>
        <div>ZOOM <span class="val" id="hud-zoom">--.-</span></div>
      </div>
    </div>
  </header>

  <!-- FABs -->
  <div class="absolute z-30 flex flex-col gap-2" style="right:14px; bottom:14px;">
    <button id="btn-filters" type="button" class="fab" title="Filtros" aria-label="Abrir filtros">
      <i data-lucide="sliders-horizontal" width="20" height="20"></i>
    </button>
    <button id="btn-recenter" type="button" class="fab" title="Recentrar" aria-label="Recentrar mapa">
      <i data-lucide="crosshair" width="20" height="20"></i>
    </button>
    <button id="btn-location" type="button" class="fab" title="Mi ubicación" aria-label="Mostrar mi ubicación">
      <i data-lucide="locate-fixed" width="20" height="20"></i>
    </button>
    <button id="btn-search" type="button" class="fab" title="Buscar edificios" aria-label="Buscar edificios">
      <i data-lucide="search" width="20" height="20"></i>
    </button>
    <button id="btn-my-places" type="button" class="fab" title="Mis edificios" aria-label="Ver favoritos y visitados">
      <i data-lucide="bookmark" width="20" height="20"></i>
    </button>
    <button id="btn-map-style" type="button" class="fab" title="Tipo de mapa" aria-label="Cambiar tipo de mapa">
      <i data-lucide="layers-2" width="20" height="20"></i>
    </button>
  </div>

  <!-- Panel de filtros -->
  <section id="filter-panel" class="filter-panel" aria-label="Filtro por arquitecto">
    <div class="filter-head">
      <span style="color:var(--fg-dim)">[ FILTRO // ARQUITECTO ]</span>
      <i data-lucide="x" id="btn-filters-close" width="14" height="14" style="cursor:pointer; color:var(--fg-dim)" role="button" aria-label="Cerrar filtros"></i>
    </div>
    <div class="filter-group" data-filter-group="decade">
      <button type="button" class="filter-group-head" aria-expanded="true"><span>[ DÉCADA ]</span><span class="filter-chevron">−</span></button>
      <div class="filter-group-body"><div class="filter-group-actions"><button type="button" class="filter-action" data-filter-all="decade">TODOS</button><button type="button" class="filter-action" data-filter-isolate="decade">AISLAR</button></div><select id="filter-decade" class="tech-input" aria-label="Filtrar por década"><option value="">TODAS LAS DÉCADAS</option></select></div>
    </div>
    <div class="filter-group" data-filter-group="category">
      <button type="button" class="filter-group-head" aria-expanded="true"><span>[ CATEGORÍA ]</span><span class="filter-chevron">−</span></button>
      <div class="filter-group-body"><div class="filter-group-actions"><button type="button" class="filter-action" data-filter-all="category">TODOS</button><button type="button" class="filter-action" data-filter-isolate="category">AISLAR</button></div><select id="filter-category" class="tech-input" aria-label="Filtrar por categoría"><option value="">TODAS LAS CATEGORÍAS</option></select></div>
    </div>
    <div class="filter-group" data-filter-group="access">
    <button type="button" class="filter-group-head" aria-expanded="true"><span>[ ACCESO ]</span><span class="filter-chevron">−</span></button>
    <div class="filter-group-body"><div class="filter-group-actions"><button type="button" class="filter-action" data-filter-all="access">TODOS</button><button type="button" class="filter-action" data-filter-isolate="access">AISLAR</button></div><select id="filter-access" class="tech-input" aria-label="Filtrar por estado de acceso"><option value="">TODOS LOS ESTADOS</option><option value="publico">PÚBLICO</option><option value="exterior_visible">EXTERIOR VISIBLE</option><option value="con_reserva">CON RESERVA</option><option value="privado">PRIVADO</option><option value="cerrado_temporalmente">CERRADO TEMPORALMENTE</option><option value="desaparecido">DESAPARECIDO</option></select></div>
    </div>
    <div class="filter-group filter-group-architects" data-filter-group="architects">
      <button type="button" class="filter-group-head" aria-expanded="true"><span>[ ARQUITECTOS ]</span><span class="filter-chevron">−</span></button>
      <div class="filter-group-body"><div class="filter-group-actions"><button type="button" class="filter-action" data-filter-all="architects">TODOS</button><button type="button" class="filter-action" data-filter-isolate="architects">AISLAR</button></div><input id="architect-search" class="tech-input" type="search" placeholder="BUSCAR ARQUITECTO..." aria-label="Buscar arquitecto"><div id="filter-switches"></div></div>
    </div>
  </section>

  <section id="my-places-panel" class="my-places-panel" aria-label="Mis edificios">
    <div class="filter-head">
      <span style="color:var(--fg-dim)">[ MI RADAR ]</span>
      <i data-lucide="x" id="btn-my-places-close" width="14" height="14" style="cursor:pointer; color:var(--fg-dim)" role="button" aria-label="Cerrar mis edificios"></i>
    </div>
    <div class="places-tabs">
      <button type="button" class="places-tab active" data-place-tab="favorite">FAVORITOS</button>
      <button type="button" class="places-tab" data-place-tab="visited">VISITADOS</button>
      <button type="button" class="places-tab" data-place-tab="notes">NOTAS</button>
    </div>
    <div id="my-places-list" class="my-places-list"></div>
  </section>

  <section id="admin-panel" class="admin-panel" aria-label="Panel de administración">
    <div class="filter-head">
      <span style="color:var(--accent-2)">[ ADMIN // PROYECTOS ]</span>
      <i data-lucide="x" id="btn-admin-close" width="14" height="14" style="cursor:pointer; color:var(--fg-dim)" role="button" aria-label="Cerrar panel admin"></i>
    </div>
    <div class="admin-toolbar">
      <input id="admin-search" class="tech-input" type="search" placeholder="BUSCAR PROYECTO..." aria-label="Buscar proyecto">
      <span id="admin-count" class="admin-count"></span>
    </div>
    <div id="admin-project-list" class="admin-project-list"></div>
  </section>

  <section id="map-style-panel" class="map-style-panel" aria-label="Tipo de mapa">
    <div class="filter-head">
      <span style="color:var(--fg-dim)">[ TIPO DE MAPA ]</span>
      <i data-lucide="x" id="btn-map-style-close" width="14" height="14" style="cursor:pointer; color:var(--fg-dim)" role="button" aria-label="Cerrar tipos de mapa"></i>
    </div>
    <div class="map-style-options">
      <button type="button" class="map-style-option" data-map-style="light">CLARO</button>
      <button type="button" class="map-style-option active" data-map-style="dark">OSCURO</button>
      <button type="button" class="map-style-option" data-map-style="satellite">SATÉLITE</button>
    </div>
  </section>

  <section id="search-panel" class="search-panel" aria-label="Buscar edificios">
    <div class="filter-head">
      <span style="color:var(--fg-dim)">[ BUSCAR // EDIFICIOS ]</span>
      <i data-lucide="x" id="btn-search-close" width="14" height="14" style="cursor:pointer; color:var(--fg-dim)" role="button" aria-label="Cerrar búsqueda"></i>
    </div>
    <div class="search-controls">
      <input id="building-search" class="tech-input" type="search" placeholder="NOMBRE DEL EDIFICIO..." aria-label="Buscar por nombre">
      <select id="building-architect" class="tech-input" aria-label="Filtrar por arquitecto">
        <option value="">TODOS LOS ARQUITECTOS</option>
      </select>
      <select id="building-decade" class="tech-input" aria-label="Filtrar por década">
        <option value="">TODAS LAS DÉCADAS</option>
      </select>
    </div>
    <div id="nearby-buildings" class="nearby-buildings"></div>
  </section>

  <!-- Sheet de ficha técnica -->
  <section id="sheet" class="sheet" aria-label="Ficha técnica de la obra">
    <div class="sheet-header">
      <div class="flex items-center gap-2">
        <i data-lucide="square-dashed-bottom-code" width="14" height="14" style="color:var(--accent)"></i>
        <span style="letter-spacing:.06em; font-size:11px; color:var(--fg-dim)">FICHA DE OBRA</span>
      </div>
      <div class="flex items-center gap-3">
        <div id="sheet-header-actions" class="sheet-header-actions"></div>
        <i data-lucide="x" id="btn-sheet-close" width="16" height="16" style="cursor:pointer; z-index: 50;" role="button" aria-label="Cerrar ficha"></i>
      </div>
    </div>
    <h2 id="sheet-title" class="font-display px-3.5 pt-3 pb-2 text-xl leading-tight" style="margin:0;"></h2>
    <div id="sheet-body"></div>
  </section>
</main>

<div id="modal-share" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-share-title">
  <div class="modal-box share-box">
    <div class="modal-head">
      <span id="modal-share-title" style="letter-spacing:.06em; font-size:11px;">COMPARTIR UBICACIÓN</span>
      <i data-lucide="x" id="btn-share-close" width="16" height="16" style="cursor:pointer" role="button" aria-label="Cerrar compartir"></i>
    </div>
    <div class="share-options">
      <button type="button" class="btn share-option" data-share-choice="native">OTRAS APLICACIONES</button>
      <button type="button" class="btn share-option" data-share-choice="whatsapp">WHATSAPP</button>
      <button type="button" class="btn share-option" data-share-choice="google">GOOGLE MAPS</button>
      <button type="button" class="btn share-option" data-share-choice="copy">COPIAR ENLACE</button>
    </div>
  </div>
</div>

<div id="modal-photo" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Fotografía del proyecto">
  <div class="photo-viewer">
    <button type="button" id="btn-photo-close" class="photo-close" aria-label="Cerrar fotografía">X</button>
    <img id="photo-viewer-image" src="" alt="">
  </div>
</div>

<!-- Modal: Login de Administrador -->
<div id="modal-login" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-login-title">
  <div class="modal-box">
    <div class="modal-head">
      <div class="flex items-center gap-2">
        <i data-lucide="terminal" width="14" height="14" style="color:var(--accent)"></i>
        <span id="modal-login-title" style="letter-spacing:.06em; font-size:11px;">AUTENTICACIÓN REQUERIDA</span>
      </div>
      <i data-lucide="x" id="btn-login-close" width="16" height="16" style="cursor:pointer" role="button" aria-label="Cerrar"></i>
    </div>
    <div class="modal-body">
      <form class="flex flex-col gap-3" onsubmit="return false;">
        <div>
          <label for="login-email" class="text-[10px] block mb-1" style="color:var(--fg-dim)">USER_EMAIL_</label>
          <input type="email" id="login-email" placeholder="admin@signes.studio" class="tech-input" autocomplete="username">
        </div>
        <div>
          <label for="login-password" class="text-[10px] block mb-1" style="color:var(--fg-dim)">PASSWORD_</label>
          <input type="password" id="login-password" placeholder="••••••••" class="tech-input" autocomplete="current-password">
        </div>
        <div id="login-error" class="text-[10px] text-red-500 hidden mt-1" role="alert"></div>
        <button id="btn-do-login" type="submit" class="btn btn-accent mt-2 w-full">AUTORIZAR ACCESO</button>
        <button id="btn-register-mode" type="button" class="btn mt-1 w-full">CREAR CUENTA</button>
        <button id="btn-logout" type="button" class="btn hidden mt-1 w-full">CERRAR SESIÓN</button>
      </form>
    </div>
  </div>
</div>

<!-- Modal: Añadir Edificio (Admin) -->
<div id="modal-add-building" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-add-title">
  <div class="modal-box">
    <div class="modal-head">
      <div class="flex items-center gap-2">
        <i data-lucide="crosshair" width="14" height="14" style="color:var(--accent-2)"></i>
        <span id="modal-add-title" style="letter-spacing:.06em; font-size:11px;">REGISTRO DE NUEVA OBRA (DB)</span>
      </div>
      <i data-lucide="x" id="btn-add-close" width="16" height="16" style="cursor:pointer" role="button" aria-label="Cerrar"></i>
    </div>
    <div class="modal-body flex flex-col gap-3">
      <div class="text-[10px] mb-1" style="color:var(--fg-dim)">
        COORD <span id="add-coords" style="color:var(--accent-2)">--</span>
      </div>

      <div>
        <label for="add-nombre" class="text-[10px] block mb-1" style="color:var(--fg-dim)">NOMBRE DE LA OBRA</label>
        <input type="text" id="add-nombre" class="tech-input">
      </div>

      <div>
        <label for="add-foto" class="text-[10px] block mb-1" style="color:var(--fg-dim)">URL DE LA FOTOGRAFÍA</label>
        <input type="url" id="add-foto" class="tech-input" placeholder="https://...">
      </div>

      <div>
        <label for="add-enlace" class="text-[10px] block mb-1" style="color:var(--fg-dim)">ENLACE DEL PROYECTO</label>
        <input type="url" id="add-enlace" class="tech-input" placeholder="https://...">
      </div>

      <div class="flex gap-2">
        <div class="flex-1">
          <label for="add-arquitecto" class="text-[10px] block mb-1" style="color:var(--fg-dim)">ARQUITECTO</label>
          <input type="text" id="add-arquitecto" class="tech-input">
        </div>
        <div class="w-1/3">
          <label for="add-ano" class="text-[10px] block mb-1" style="color:var(--fg-dim)">AÑO</label>
          <input type="number" id="add-ano" class="tech-input">
        </div>
      </div>

      <div>
        <label for="add-importancia" class="text-[10px] block mb-1" style="color:var(--fg-dim)">IMPORTANCIA</label>
        <select id="add-importancia" class="tech-input">
          <option value="1">1 — ALTA</option>
          <option value="2">2 — MEDIA</option>
          <option value="3">3 — BAJA</option>
        </select>
      </div>

      <div class="flex gap-2">
        <div class="flex-1">
          <label for="add-categoria" class="text-[10px] block mb-1" style="color:var(--fg-dim)">CATEGORÍA</label>
          <select id="add-categoria" class="tech-input">
            <option value="residencial">RESIDENCIAL</option>
            <option value="equipamiento">EQUIPAMIENTO</option>
            <option value="parque o jardin">PARQUE O JARDÍN</option>
            <option value="proyecto urbano">PROYECTO URBANO</option>
            <option value="industrial">INDUSTRIAL</option>
            <option value="religioso">RELIGIOSO</option>
            <option value="otro">OTRO</option>
          </select>
        </div>
          <div class="flex-1">
          <label for="add-acceso" class="text-[10px] block mb-1" style="color:var(--fg-dim)">ESTADO DE ACCESO</label>
          <select id="add-acceso" class="tech-input">
            <option value="publico">PÚBLICO</option>
            <option value="exterior_visible">EXTERIOR VISIBLE</option>
            <option value="con_reserva">CON RESERVA</option>
            <option value="privado">PRIVADO</option>
            <option value="cerrado_temporalmente">CERRADO TEMPORALMENTE</option>
            <option value="desaparecido">DESAPARECIDO</option>
          </select>
        </div>
      </div>

      <div id="add-error" class="text-[10px] text-red-500 hidden mt-1" role="alert"></div>

      <div class="flex justify-end gap-2 mt-2">
        <button class="btn" id="btn-add-cancel" type="button">CANCELAR</button>
        <button class="btn btn-accent2" id="btn-add-save" type="button">
          <span class="inline-flex items-center gap-1"><i data-lucide="database" width="13" height="13"></i> PUBLICAR</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Lógica de la aplicación: módulo ES6, se ejecuta en modo defer nativo -->
<script type="module" src="js/main.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
