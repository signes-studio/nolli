<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NOLLI // RADAR ARQUITECTÓNICO</title>

<!-- Tailwind (CDN, desarrollo rápido) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Mapbox GL JS -->
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<!-- Tipografías: mono para datos, sans geométrica gruesa para títulos -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:            #000000;
    --bg-panel:      #0a0a0a;
    --bg-raised:     #121212;
    --accent:        #FF4500; /* naranja técnico */
    --accent-2:      #39FF14; /* verde fósforo (notas privadas) */
    --fg:            #FFFFFF;
    --fg-dim:        #7a7a7a;
    --border:        #2b2b2b;
    --border-strong: #4a4a4a;
  }

  *{ border-radius:0 !important; box-sizing:border-box; }
  html,body{ height:100%; margin:0; overscroll-behavior:none; }
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'JetBrains Mono', monospace;
    -webkit-tap-highlight-color:transparent;
  }
  .font-display{
    font-family:'Archivo Black', sans-serif;
    letter-spacing:-0.02em;
  }
  ::selection{ background:var(--accent); color:#000; }
  ::-webkit-scrollbar{ width:4px; height:4px; }
  ::-webkit-scrollbar-track{ background:var(--bg); }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); }

  #map{ position:absolute; inset:0; }

  /* Mapbox logo / attribution: mantener pero atenuar visualmente */
  .mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib{ filter:grayscale(1) opacity(0.5); }
  .mapboxgl-ctrl-attrib-inner a{ color:#888 !important; }
  .mapboxgl-popup-tip{ display:none; }
  .mapboxgl-canvas{ outline:none; }

  /* ---------- HUD: marco de visor tipo instrumento óptico ---------- */
  .hud-frame{ position:absolute; inset:0; pointer-events:none; z-index:20; }
  .hud-corner{ position:absolute; width:22px; height:22px; border-color:var(--accent); opacity:0.85; }
  .hud-corner.tl{ top:8px; left:8px; border-top:2px solid; border-left:2px solid; }
  .hud-corner.tr{ top:8px; right:8px; border-top:2px solid; border-right:2px solid; }
  .hud-corner.bl{ bottom:8px; left:8px; border-bottom:2px solid; border-left:2px solid; }
  .hud-corner.br{ bottom:8px; right:8px; border-bottom:2px solid; border-right:2px solid; }

  .hud-crosshair{
    position:absolute; top:50%; left:50%; width:18px; height:18px;
    transform:translate(-50%,-50%); pointer-events:none; z-index:20; opacity:0.55;
  }
  .hud-crosshair::before, .hud-crosshair::after{
    content:''; position:absolute; background:var(--fg);
  }
  .hud-crosshair::before{ top:50%; left:0; width:100%; height:1px; transform:translateY(-50%); }
  .hud-crosshair::after{ left:50%; top:0; height:100%; width:1px; transform:translateX(-50%); }

  /* ---------- Barra superior ---------- */
  .topbar{
    position:absolute; top:0; left:0; right:0; z-index:30;
    background:linear-gradient(to bottom, rgba(0,0,0,0.92), rgba(0,0,0,0));
    padding:14px 14px 30px 14px;
  }
  .topbar-inner{
    display:flex; align-items:flex-start; justify-content:space-between;
    border-bottom:1px solid var(--border-strong);
    padding-bottom:10px;
  }
  .hud-readout{ text-align:right; font-size:10px; line-height:1.5; color:var(--fg-dim); }
  .hud-readout .val{ color:var(--accent); font-weight:700; }

  /* ---------- Botones flotantes ---------- */
  .fab{
    width:46px; height:46px; display:flex; align-items:center; justify-content:center;
    background:var(--bg-panel); border:1px solid var(--border-strong); color:var(--fg);
    cursor:pointer; transition:background .1s, border-color .1s;
  }
  .fab:active{ background:var(--accent); color:#000; border-color:var(--accent); }
  .fab.active-state{ background:var(--accent); color:#000; border-color:var(--accent); }

  /* ---------- Panel de ficha técnica (bottom sheet) ---------- */
  .sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:40;
    background:var(--bg-panel);
    border-top:1px solid var(--accent);
    transform:translateY(100%);
    transition:transform .22s cubic-bezier(.2,.8,.2,1);
    max-height:62vh; overflow-y:auto;
  }
  .sheet.open{ transform:translateY(0); }
  .sheet-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--border);
    background:var(--bg-raised);
  }
  .data-row{
    display:flex; border-bottom:1px solid var(--border);
    font-size:12px;
  }
  .data-row .label{
    width:130px; flex-shrink:0; padding:10px 12px; color:var(--fg-dim);
    background:rgba(255,255,255,0.02); border-right:1px solid var(--border);
    font-size:10px; letter-spacing:.04em;
  }
  .data-row .value{ padding:10px 12px; color:var(--fg); font-weight:500; word-break:break-word; }
  .data-row .value.accent{ color:var(--accent); }

  /* ---------- Panel de filtros ---------- */
  .filter-panel{
    position:absolute; right:14px; bottom:0; z-index:40;
    width:min(280px, calc(100vw - 28px));
    background:var(--bg-panel); border:1px solid var(--border-strong);
    transform:translateY(calc(100% + 14px)) translateY(-84px);
    transition:transform .22s cubic-bezier(.2,.8,.2,1);
  }
  .filter-panel.open{ transform:translateY(-84px); }
  .filter-head{
    padding:10px 12px; border-bottom:1px solid var(--border);
    background:var(--bg-raised); font-size:11px; letter-spacing:.06em;
    display:flex; justify-content:space-between; align-items:center;
  }
  .switch-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 12px; border-bottom:1px solid var(--border); font-size:11px;
  }
  .switch-row:last-child{ border-bottom:none; }
  .tech-switch{ position:relative; width:38px; height:18px; flex-shrink:0; }
  .tech-switch input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; z-index:2; }
  .tech-switch .track{ position:absolute; inset:0; background:#1a1a1a; border:1px solid var(--border-strong); }
  .tech-switch .thumb{
    position:absolute; top:2px; left:2px; width:12px; height:12px; background:var(--fg-dim);
    transition:left .15s, background .15s;
  }
  .tech-switch input:checked ~ .thumb{ left:22px; background:var(--accent); }
  .tech-switch input:checked ~ .track{ border-color:var(--accent); }

  /* ---------- Modal: nueva entrada de registro ---------- */
  .modal-overlay{
    position:fixed; inset:0; z-index:60; background:rgba(0,0,0,0.82);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .15s; padding:16px;
  }
  .modal-overlay.open{ opacity:1; pointer-events:all; }
  .modal-box{
    width:100%; max-width:420px; background:var(--bg-panel);
    border:1px solid var(--accent); box-shadow:0 0 0 1px #000, 0 0 24px rgba(255,69,0,0.15);
  }
  .modal-head{
    padding:12px 14px; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center;
  }
  .modal-body{ padding:14px; }
  .modal-body textarea{
    width:100%; min-height:110px; background:#000; border:1px solid var(--accent);
    color:var(--fg); font-family:'JetBrains Mono', monospace; font-size:12px;
    padding:10px; resize:vertical;
  }
  .modal-body textarea:focus{ outline:none; box-shadow:0 0 0 1px var(--accent); }
  .btn{
    font-size:11px; letter-spacing:.06em; padding:10px 14px;
    border:1px solid var(--border-strong); background:var(--bg-raised); color:var(--fg);
    cursor:pointer; font-family:'JetBrains Mono', monospace;
  }
  .btn-accent{ background:var(--accent); border-color:var(--accent); color:#000; font-weight:700; }
  .btn-accent2{ background:var(--accent-2); border-color:var(--accent-2); color:#000; font-weight:700; }

  .blink{ animation:blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
</style>
</head>
<body>

<div id="map"></div>

<!-- Marco HUD decorativo -->
<div class="hud-frame">
  <div class="hud-corner tl"></div>
  <div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div>
  <div class="hud-corner br"></div>
</div>
<div class="hud-crosshair"></div>

<!-- Barra superior -->
<div class="topbar">
  <div class="topbar-inner">
    <div>
      <div class="font-display text-2xl leading-none tracking-tight" style="color:var(--fg)">NOLLI<span style="color:var(--accent)">.</span></div>
      <div class="text-[10px] tracking-widest mt-1" style="color:var(--fg-dim)">RADAR ARQUITECTÓNICO — V0.2 DB LINK</div>
    </div>
    <div class="hud-readout">
      <div>LNG <span class="val" id="hud-lng">--.-----</span></div>
      <div>LAT <span class="val" id="hud-lat">--.-----</span></div>
      <div>ZOOM <span class="val" id="hud-zoom">--.-</span></div>
    </div>
  </div>
</div>

<!-- FABs -->
<div class="absolute z-30 flex flex-col gap-2" style="right:14px; bottom:14px;">
  <button id="btn-filters" class="fab" title="Filtros">
    <i data-lucide="sliders-horizontal" width="20" height="20"></i>
  </button>
  <button id="btn-recenter" class="fab" title="Recentrar">
    <i data-lucide="crosshair" width="20" height="20"></i>
  </button>
</div>

<!-- Panel de filtros -->
<div id="filter-panel" class="filter-panel">
  <div class="filter-head">
    <span style="color:var(--fg-dim)">[ FILTRO // SISTEMA ESTRUCTURAL ]</span>
    <i data-lucide="x" id="btn-filters-close" width="14" height="14" style="cursor:pointer; color:var(--fg-dim)"></i>
  </div>
  <div id="filter-switches"></div>
</div>

<!-- Sheet de ficha técnica -->
<div id="sheet" class="sheet">
  <div class="sheet-header">
    <div class="flex items-center gap-2">
      <i data-lucide="square-dashed-bottom-code" width="14" height="14" style="color:var(--accent)"></i>
      <span style="letter-spacing:.06em; font-size:11px; color:var(--fg-dim)">FICHA_OBRA.DAT</span>
    </div>
    <i data-lucide="x" id="btn-sheet-close" width="16" height="16" style="cursor:pointer"></i>
  </div>
  <div id="sheet-title" class="font-display px-3.5 pt-3 pb-2 text-xl leading-tight"></div>
  <div id="sheet-body"></div>
</div>

<!-- Modal: nueva entrada de registro -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <div class="flex items-center gap-2">
        <i data-lucide="crosshair" width="14" height="14" style="color:var(--accent-2)"></i>
        <span style="letter-spacing:.06em; font-size:11px;">NUEVA ENTRADA DE REGISTRO</span>
      </div>
      <i data-lucide="x" id="btn-modal-close" width="16" height="16" style="cursor:pointer"></i>
    </div>
    <div class="modal-body">
      <div class="text-[10px] mb-2" style="color:var(--fg-dim)">
        COORD <span id="modal-coords" style="color:var(--accent-2)">--</span>
      </div>
      <label class="text-[10px] block mb-1" style="color:var(--fg-dim)">NOTA_DE_CAMPO<span class="blink" style="color:var(--accent-2)">_</span></label>
      <textarea id="modal-textarea" placeholder="Introduce observación técnica..."></textarea>
      <div class="flex justify-end gap-2 mt-3">
        <button class="btn" id="btn-modal-cancel">CANCELAR</button>
        <button class="btn btn-accent2" id="btn-modal-save">
          <span class="inline-flex items-center gap-1"><i data-lucide="save" width="13" height="13"></i> GUARDAR</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   NOLLI — CONEXIÓN SUPABASE EN VIVO
   ========================================================================= */

// CLAVES DE ACCESO
mapboxgl.accessToken = 'pk.eyJ1Ijoic2lnbmVzYXJjaCIsImEiOiJjbXQ3YjdzNXQyNjB2MnhxdW5vdjF6YjV3In0.tFJ9jN3e1z3ezNM9x0ofpg';

// ¡Sustituye esta URL por tu "Project URL" de Supabase!
const SUPABASE_URL = 'https://ldtfvpjigzvcagtciipn.supabase.co'; 
const SUPABASE_KEY = 'sb_publishable_kYQ7Fa8nBsrkp1f8C4AuAg_4-5uBFm0';

// VARIABLES GLOBALES (Se rellenarán dinámicamente)
let OBRAS = [];
let SISTEMAS = [];
let activeSistemas = new Set();
let notasCollection = { type: 'FeatureCollection', features: [] };
let notaCounter = 0;
let map; // Instancia global del mapa

/* ---------------------------------------------------------------------
   1. CONEXIÓN A LA BASE DE DATOS (SUPABASE)
   --------------------------------------------------------------------- */
async function inicializarRadar() {
  try {
    const respuesta = await fetch(`${SUPABASE_URL}/rest/v1/edificios?select=*`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });

    if (!respuesta.ok) {
      throw new Error('Fallo al conectar con la base de datos.');
    }

    const datosDB = await respuesta.json();

    // Adaptamos los datos de Supabase a la estructura que usa el mapa
    OBRAS = datosDB.map(fila => ({
      id: fila.id,
      codigo_obra: fila.codigo_obra,
      nombre_obra: fila.nombre_obra,
      arquitecto: fila.arquitecto,
      año_construccion: fila.año_construccion,
      sistema_estructural: fila.sistema_estructural,
      coordenadas: [fila.longitud, fila.latitud]
    }));

    // Extraemos etiquetas únicas para los filtros
    SISTEMAS = [...new Set(OBRAS.map(o => o.sistema_estructural))];
    activeSistemas = new Set(SISTEMAS);

    // Renderizamos la UI y el mapa
    generarFiltrosUI();
    cargarMapaMapbox();

  } catch (error) {
    console.error("Error cargando el radar:", error);
    alert("Error de conexión. Comprueba que SUPABASE_URL está correctamente puesta en el código y que la tabla 'edificios' existe.");
  }
}

/* ---------------------------------------------------------------------
   2. GENERACIÓN DINÁMICA DE FILTROS
   --------------------------------------------------------------------- */
function generarFiltrosUI() {
  const filterSwitches = document.getElementById('filter-switches');
  filterSwitches.innerHTML = ''; 

  SISTEMAS.forEach((sistema) => {
    const row = document.createElement('div');
    row.className = 'switch-row';
    row.innerHTML = `
      <span>${sistema || 'SIN ESTRUCTURA'}</span>
      <div class="tech-switch">
        <input type="checkbox" checked data-sistema="${sistema}">
        <div class="track"></div>
        <div class="thumb"></div>
      </div>
    `;
    filterSwitches.appendChild(row);
  });

  filterSwitches.addEventListener('change', (e) => {
    const input = e.target;
    if (input.type !== 'checkbox') return;
    const sistema = input.dataset.sistema;
    if (input.checked) activeSistemas.add(sistema);
    else activeSistemas.delete(sistema);
    applyFilter();
  });
}

function applyFilter() {
  if (!map || !map.getLayer('obras-layer')) return;
  map.setFilter('obras-layer', [
    'in', ['get', 'sistema_estructural'], ['literal', [...activeSistemas]]
  ]);
}

/* ---------------------------------------------------------------------
   3. INICIALIZACIÓN DEL MAPA
   --------------------------------------------------------------------- */
function cargarMapaMapbox() {
  map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [-0.3690, 39.4690],
    zoom: 12.4,
    pitch: 0,
    attributionControl: true
  });
  
  map.dragRotate.disable();
  map.touchZoomRotate.disableRotation();

  map.on('load', () => {
    map.addImage('icon-target', buildIcon(drawTargetIcon), { pixelRatio: 2 });
    map.addImage('icon-note', buildIcon(drawNoteIcon), { pixelRatio: 2 });

    // Cargar los edificios desde la variable OBRAS (ya descargada de Supabase)
    map.addSource('obras', {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: OBRAS.map(o => ({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: o.coordenadas },
          properties: o
        }))
      }
    });

    map.addLayer({
      id: 'obras-layer',
      type: 'symbol',
      source: 'obras',
      layout: {
        'icon-image': 'icon-target',
        'icon-size': 0.62,
        'icon-allow-overlap': true
      }
    });

    map.addSource('notas', { type: 'geojson', data: notasCollection });
    map.addLayer({
      id: 'notas-layer',
      type: 'symbol',
      source: 'notas',
      layout: {
        'icon-image': 'icon-note',
        'icon-size': 0.55,
        'icon-allow-overlap': true
      }
    });

    map.on('mouseenter', 'obras-layer', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'obras-layer', () => map.getCanvas().style.cursor = '');
    map.on('mouseenter', 'notas-layer', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'notas-layer', () => map.getCanvas().style.cursor = '');

    iniciarInteractividadMapbox();
  });

  // HUD actualización de coordenadas
  const hudLng = document.getElementById('hud-lng');
  const hudLat = document.getElementById('hud-lat');
  const hudZoom = document.getElementById('hud-zoom');

  function updateHud(lngLat) {
    if (lngLat) {
      hudLng.textContent = lngLat.lng.toFixed(5);
      hudLat.textContent = lngLat.lat.toFixed(5);
    }
    hudZoom.textContent = map.getZoom().toFixed(1);
  }
  map.on('mousemove', e => updateHud(e.lngLat));
  map.on('move', () => updateHud());
  map.on('load', () => updateHud(map.getCenter()));

  document.getElementById('btn-recenter').addEventListener('click', () => {
    map.flyTo({ center: [-0.3690, 39.4690], zoom: 12.4 });
  });
}

/* ---------------------------------------------------------------------
   4. EVENTOS DE INTERFAZ Y CLICKS EN EL MAPA
   --------------------------------------------------------------------- */
function iniciarInteractividadMapbox() {
  const sheet = document.getElementById('sheet');
  const sheetTitle = document.getElementById('sheet-title');
  const sheetBody = document.getElementById('sheet-body');

  function openSheetForObra(props, coords) {
    sheetTitle.innerHTML = props.nombre_obra;
    sheetBody.innerHTML = `
      <div class="data-row"><div class="label">[CÓDIGO]</div><div class="value accent">${props.codigo_obra}</div></div>
      <div class="data-row"><div class="label">[ARQUITECTO]</div><div class="value">${props.arquitecto}</div></div>
      <div class="data-row"><div class="label">[AÑO]</div><div class="value">${props.año_construccion}</div></div>
      <div class="data-row"><div class="label">[ESTRUCTURA]</div><div class="value">${props.sistema_estructural}</div></div>
      <div class="data-row"><div class="label">[COORD]</div><div class="value">${coords[0].toFixed(5)}, ${coords[1].toFixed(5)}</div></div>
    `;
    sheet.classList.add('open');
    closeFilters();
  }

  function openSheetForNota(props, coords) {
    sheetTitle.innerHTML = `ENTRADA DE REGISTRO`;
    sheetBody.innerHTML = `
      <div class="data-row"><div class="label" style="border-color:var(--accent-2)">[ID]</div><div class="value" style="color:var(--accent-2)">NOTA-${String(props.id).padStart(3,'0')}</div></div>
      <div class="data-row"><div class="label">[FECHA]</div><div class="value">${props.fecha}</div></div>
      <div class="data-row"><div class="label">[COORD]</div><div class="value">${coords[0].toFixed(5)}, ${coords[1].toFixed(5)}</div></div>
      <div class="data-row"><div class="label">[NOTA]</div><div class="value">${props.nota}</div></div>
    `;
    sheet.classList.add('open');
    closeFilters();
  }

  document.getElementById('btn-sheet-close').addEventListener('click', () => sheet.classList.remove('open'));

  map.on('click', 'obras-layer', (e) => {
    const feature = e.features[0];
    openSheetForObra(feature.properties, feature.geometry.coordinates);
  });

  map.on('click', 'notas-layer', (e) => {
    const feature = e.features[0];
    openSheetForNota(feature.properties, feature.geometry.coordinates);
  });

  // Funcionalidad extra del mapa (Pulsación Larga para notas)
  const modalOverlay = document.getElementById('modal-overlay');
  const modalCoords = document.getElementById('modal-coords');
  const modalTextarea = document.getElementById('modal-textarea');
  let pendingLngLat = null;

  map.on('contextmenu', (e) => openRegistroModal(e.lngLat));

  let pressTimer = null;
  let pressStart = null;
  map.on('touchstart', (e) => {
    if (e.points.length > 1) return;
    pressStart = e.lngLat;
    pressTimer = setTimeout(() => openRegistroModal(pressStart), 600);
  });
  map.on('touchmove', () => clearTimeout(pressTimer));
  map.on('touchend', () => clearTimeout(pressTimer));

  function openRegistroModal(lngLat) {
    pendingLngLat = lngLat;
    modalCoords.textContent = `${lngLat.lng.toFixed(5)}, ${lngLat.lat.toFixed(5)}`;
    modalTextarea.value = '';
    modalOverlay.classList.add('open');
    setTimeout(() => modalTextarea.focus(), 50);
  }

  function closeModal() { modalOverlay.classList.remove('open'); pendingLngLat = null; }

  document.getElementById('btn-modal-close').addEventListener('click', closeModal);
  document.getElementById('btn-modal-cancel').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

  document.getElementById('btn-modal-save').addEventListener('click', () => {
    const texto = modalTextarea.value.trim();
    if (!texto || !pendingLngLat) { closeModal(); return; }
    notaCounter += 1;
    const feature = {
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [pendingLngLat.lng, pendingLngLat.lat] },
      properties: {
        id: notaCounter,
        nota: texto,
        fecha: new Date().toISOString().slice(0, 16).replace('T', ' ')
      }
    };
    notasCollection.features.push(feature);
    if (map.getSource('notas')) map.getSource('notas').setData(notasCollection);
    closeModal();
  });
}

/* ---------------------------------------------------------------------
   5. DIBUJADO DE ICONOS (CANVAS)
   --------------------------------------------------------------------- */
function buildIcon(draw, size = 64) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  draw(ctx, size);
  return ctx.getImageData(0, 0, size, size);
}

function drawTargetIcon(ctx, s) {
  const c = s / 2;
  ctx.strokeStyle = '#FF4500';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(c, c, s * 0.30, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(c, s * 0.06); ctx.lineTo(c, s * 0.28);
  ctx.moveTo(c, s * 0.72); ctx.lineTo(c, s * 0.94);
  ctx.moveTo(s * 0.06, c); ctx.lineTo(s * 0.28, c);
  ctx.moveTo(s * 0.72, c); ctx.lineTo(s * 0.94, c);
  ctx.stroke();
  ctx.fillStyle = '#FF4500';
  ctx.beginPath(); ctx.arc(c, c, 3.5, 0, Math.PI * 2); ctx.fill();
}

function drawNoteIcon(ctx, s) {
  const m = s * 0.16;
  ctx.strokeStyle = '#39FF14';
  ctx.lineWidth = 4;
  ctx.strokeRect(m, m, s - m * 2, s - m * 2);
  ctx.beginPath();
  ctx.moveTo(m + 6, m + 6); ctx.lineTo(s - m - 6, s - m - 6);
  ctx.moveTo(s - m - 6, m + 6); ctx.lineTo(m + 6, s - m - 6);
  ctx.stroke();
}
